<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Tienda · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1c2a27;--muted:#6b7a76;--side:#17352e;--side-ink:#cfe0db;--accent:#e0a526;--line:#dfe5e3;--err:#a8321f}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
aside h1{font-size:19px;color:#fff;padding:0 10px 20px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;margin-bottom:3px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.active{background:var(--accent);color:#1c2a27;font-weight:700}
main{flex:1;padding:32px;max-width:1200px;min-width:0}
h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:14px}.stat small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:8px}
form.fila,.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end}
label,.campo{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.box.visible{overflow:visible}
.auto{position:relative}
.auto-in{width:100%;min-width:240px}
.auto-lista{position:absolute;z-index:30;left:0;top:100%;min-width:100%;width:max-content;max-width:90vw;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.14);margin-top:2px}
.auto-op{padding:8px 12px;cursor:pointer;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;gap:14px}
.auto-op small{color:var(--muted);white-space:nowrap}
.auto-op.sel,.auto-op:hover{background:#eef3f1}
.auto-op.off{opacity:.5;cursor:not-allowed}
.auto-nada{padding:8px 12px;color:var(--muted);font-size:14px}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);min-width:150px;background:#fff}
input:disabled,select:disabled{background:#eef1f0}
button{padding:9px 16px;border:0;border-radius:8px;background:var(--side);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button:hover{background:#0f2520}
button.gris{background:#6b7a76}button.gris:hover{background:#54625e}
button.mini{padding:5px 10px;font-size:13px}
button.peligro{background:#8f2d1d}button.peligro:hover{background:#6e2013}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;white-space:nowrap}
/* La columna de botones queda fija a la derecha para que siempre se vea, aunque la tabla sea ancha */
th.acc,td.acc{position:sticky;right:0;background:var(--panel);white-space:nowrap;box-shadow:-8px 0 8px -8px rgba(0,0,0,.25)}
.msg{padding:14px;border-radius:8px;background:#fbefec;color:var(--err);margin-bottom:12px}
.vacio{color:var(--muted);padding:12px 0}
.login{max-width:360px}
.sec{font-weight:700;margin:6px 0 8px}
.lineas{display:flex;flex-direction:column;gap:8px;width:100%}
.linea{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.total{font-size:18px;font-weight:700;align-self:center}
.subt{align-self:center;color:var(--muted);font-size:14px;margin:4px 0}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.hbar{background:var(--line);border-radius:6px;height:12px}.hbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Encabezados fijos: la tabla se desplaza dentro de su propio recuadro y la fila de títulos se queda arriba */
.tabla-scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.tabla-scroll table{border-collapse:separate;border-spacing:0}
.tabla-scroll th{position:sticky;top:0;z-index:2;background:#f3f6f5;border-bottom:1px solid var(--line)}
.tabla-scroll th.acc{z-index:4;background:#f3f6f5}
.tabla-scroll td.acc{z-index:1}
.stats.chico .stat b{font-size:17px;word-break:break-word}
button.enlace{background:none;color:var(--side);padding:0;font-weight:700;text-decoration:underline;text-align:left}
button.enlace:hover{background:none;color:var(--accent)}
.modal-fondo{position:fixed;inset:0;background:rgba(15,25,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border-radius:12px;max-width:900px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal h3{font-size:22px}
.modal h4{margin:18px 0 6px;font-size:15px}
.modal .tabla{overflow-x:auto}
.modal .venta-det{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.pie-total{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:#f3f6f5;border:1px solid var(--line);border-radius:8px}
.pie-total .enlace{font-size:22px}
.pie-total small{color:var(--muted);font-weight:400}
.atajos{display:flex;gap:6px;align-items:flex-end}
.modal .cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 18px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}
nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}aside h1{padding-bottom:10px}main{padding:18px}}
</style>
</head>
<body>
<aside><h1>Mi Tienda</h1><nav id="menu"></nav></aside>
<main id="app"></main>

<script>
/* ---------- Utilidades ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0);
const pct = n => Number(n).toLocaleString("es-CO", {maximumFractionDigits: 1}) + "%";   // 44,7%
const TZ = "America/Bogota";   // todas las fechas se muestran en hora de Colombia
const fecha = f => f ? new Date(f).toLocaleString("es-CO", {timeZone: TZ, dateStyle: "short", timeStyle: "short"}) : "";
const soloFecha = f => f ? String(f).slice(0, 10).split("-").reverse().join("/") : "";
const diaCO = f => new Date(f).toLocaleDateString("en-CA", {timeZone: TZ});
const mesCO = f => diaCO(f).slice(0, 7);
const nombreMes = m => new Date(m + "-15T12:00:00").toLocaleDateString("es-CO", {month: "long", year: "numeric"});
const mesCorto = m => new Date(m + "-15T12:00:00").toLocaleDateString("es-CO", {month: "short"}).replace(".", "");
const mesAnterior = m => { const [y, n] = m.split("-").map(Number); const d = new Date(y, n - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };

async function api(tabla, method = "GET", body, id) {
  let r;
  try {
    r = await fetch(`/api?tabla=${tabla}${id ? "&id=" + id : ""}`, {
      method,
      headers: {"x-admin-key": sessionStorage.getItem("k") || "", "Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined
    });
  } catch { throw new Error("SIN_SERVIDOR"); }
  if (r.status === 401) { sessionStorage.removeItem("k"); throw new Error("AUTH"); }
  if (r.status === 404 && !(r.headers.get("content-type") || "").includes("json")) throw new Error("SIN_SERVIDOR");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error inesperado");
  return d;
}
const error = e => e.message === "SIN_SERVIDOR"
  ? "No se pudo conectar con el servidor. Abre el sitio desde su dirección de Netlify y revisa que la función esté desplegada."
  : esc(e.message);

/* ---------- Configuración de módulos ----------
   cols: columnas de la lista · campos: formulario · filtros: {k,l} valores distintos, {k,l,mes:1} por mes, {l,fn:[[texto,función]]} a medida
   orden: [texto, columna, tipo (t texto, n número, d fecha), dirección (1 o -1)] */
const nombreAZ = [["Nombre (A-Z)","nombre","t"],["Nombre (Z-A)","nombre","t",-1]];
const CFG = {
  categorias:{nombre:"Categorías",sub:"Agrupa tus productos (licores, bebidas, mecatos…)",tabla:"categorias",boton:"Agregar categoría",
    aviso:"Solo se puede eliminar si no tiene productos.",
    cols:[["nombre","Categoría"],["productos","Productos"]],
    campos:[{k:"nombre",l:"Nombre de la categoría",req:1}],
    orden:[...nombreAZ,["Más productos","productos","n",-1]]},
  productos:{nombre:"Productos",sub:"Lista básica: haz clic en «Ver» para la información completa del producto. El código se genera solo; el precio de venta es el último que escribiste en una venta y la ganancia es precio de venta − costo del último lote (% sobre el costo)",tabla:"productos",costos:1,fuentes:["lotes_stock"],ver:"verProducto",boton:"Agregar producto",
    aviso:"Solo se puede eliminar si no tiene compras ni ventas registradas.",
    cols:[["codigo","Código"],["nombre","Producto","prod"],["categoria","Categoría"],["precio_venta","Precio de venta","$"],["ganancia","Ganancia por unidad","gan"],["stock","Stock"]],
    campos:[{k:"nombre",l:"Producto",req:1},{k:"categoria_id",l:"Categoría",t:"select",src:"categorias",ver:"nombre",req:1},
      {k:"precio_total_compra",l:"Precio total de compra",t:"number",req:1},{k:"unidades_compra",l:"Unidades compradas",t:"number",req:1},
      {k:"precio_venta",l:"Precio de venta al público (por unidad)",t:"number",req:1}],
    hint:{total:"precio_total_compra",unidades:"unidades_compra",venta:"precio_venta"},
    filtros:[{k:"categoria",l:"Categoría"},{l:"Stock",fn:[["Con stock",r=>r.stock>0],["Sin stock",r=>r.stock<=0],["Stock bajo",r=>r.stock<=r.stock_minimo]]}],
    orden:[...nombreAZ,["Código","codigo","t"],["Mayor ganancia %","ganancia_pct","n",-1],["Mayor ganancia $","ganancia","n",-1],["Mayor stock","stock","n",-1],["Menor stock","stock","n"]]},
  inventario:{nombre:"Inventario",sub:"Lista básica: haz clic en «Ver» para la información completa de la compra. Compras y ajustes de stock; la fecha y hora se registran solas (hora de Colombia)",tabla:"inventario_movimientos",fuentes:["lotes_stock"],ver:"verMovimiento",boton:"Registrar movimiento",
    aviso:"Solo se puede eliminar si no se han vendido sus unidades.",
    cols:[["fecha","Fecha y hora","f"],["producto","Producto","mov"],["categoria","Categoría"],["lote","N° de lote"],["proveedor","Proveedor"],["cantidad","Unidades"]],
    campos:[{k:"producto_id",l:"Producto",t:"select",src:"productos",ver:"nombre",req:1,bloquear:1,auto:1},
      {k:"proveedor_id",l:"Proveedor (opcional)",t:"select",src:"proveedores",ver:"empresa",auto:1},
      {k:"tipo",l:"Tipo",t:"select",op:["Compra","Ajuste"]},{k:"lote",l:"N° de lote"},
      {k:"cantidad",l:"Unidades compradas (ajuste: negativo si resta)",t:"number",req:1},{k:"precio_total",l:"Precio total pagado",t:"number"},
      {k:"fecha_vencimiento",l:"Fecha de vencimiento",t:"date"}],
    hint:{total:"precio_total",unidades:"cantidad",texto:"Precio unitario"},
    filtros:[{k:"categoria",l:"Categoría"},{k:"producto",l:"Producto"},{k:"proveedor",l:"Proveedor"},{k:"tipo",l:"Tipo"},{k:"fecha",l:"Mes",mes:1}],
    orden:[["Más recientes","fecha","d",-1],["Más antiguos","fecha","d"],["Producto (A-Z)","producto","t"],["Vence primero","fecha_vencimiento","d"]]},
  ventas:{nombre:"Ventas",sub:"Lista básica: haz clic en «Ver» para la venta completa. Eliges el lote (solo salen los que tienen unidades) y escribes el precio de venta al público. Ganancia = total vendido − total del costo del lote elegido, y % sobre el costo. Al registrar la venta, el precio y el costo quedan fijos. Hora de Colombia",tabla:"ventas",
    aviso:"Los productos vuelven al stock y se quita su ingreso en caja.",
    costos:1, rango:1,
    fuentes:["clientes","productos","lotes_stock"],ver:"verVenta",
    cols:[["id","N°","venta"],["fecha","Fecha y hora","f"],["cliente","Cliente"],["total","Total","$"],["debe","Debe","$"],["ganancia","Ganancia","gan"]],
    campos:[{k:"cliente_id",l:"Cliente que compra",t:"select",src:"clientes",ver:"nombre",auto:1},{k:"debe",l:"Debe (lo que queda fiado)",t:"number"}],
    filtros:[{k:"cliente",l:"Cliente"},{l:"Pago",fn:[["Con deuda",r=>Number(r.debe)>0],["Pagadas",r=>Number(r.debe)===0]]},{k:"fecha",l:"Mes",mes:1}],
    orden:[["Más recientes","fecha","d",-1],["Más antiguas","fecha","d"],["Mayor total","total","n",-1],["Menor total","total","n"],["Mayor ganancia","ganancia","n",-1],["Cliente (A-Z)","cliente","t"]],
    lista2:{tabla:"venta_items",oculta:1,titulo:"Detalle de productos vendidos",
      cols:[["venta_id","Venta N°"],["fecha","Fecha y hora","f"],["cliente","Cliente"],["producto","Producto"],["lote","N° de lote"],["cantidad","Cantidad"],["precio_unitario","Precio unitario","$"],["costo_lote","Costo (lote vendido)","$"],["subtotal","Total","$"],["ganancia_inv","Ganancia","ganinv"]]}},
  clientes:{nombre:"Clientes",sub:"Tus compradores y lo que te deben. Haz clic en «Ver» para el detalle de su deuda",tabla:"clientes",ver:"verCliente",boton:"Agregar cliente",
    aviso:"Solo se puede eliminar si no tiene ventas ni abonos.",
    cols:[["id","N°"],["nombre","Nombre","cli"],["telefono","Teléfono"],["correo","Correo"],["deuda","Deuda","$"]],
    campos:[{k:"nombre",l:"Nombre",req:1},{k:"telefono",l:"Teléfono"},{k:"correo",l:"Correo"}],
    filtros:[{l:"Deuda",fn:[["Con deuda",r=>Number(r.deuda)>0],["Sin deuda",r=>Number(r.deuda)<=0]]}],
    orden:[...nombreAZ,["Mayor deuda","deuda","n",-1],["Más recientes","creado","d",-1]],
    extra:{tabla:"abonos",titulo:"Registrar abono a una deuda",boton:"Registrar abono",
      campos:[{k:"cliente_id",l:"Cliente",t:"select",src:"clientes",ver:"nombre",req:1,auto:1},{k:"monto",l:"Monto del abono",t:"number",req:1}]},
    lista2:{tabla:"abonos",titulo:"Abonos registrados",borrar:1,cols:[["fecha","Fecha y hora","f"],["cliente","Cliente"],["monto","Monto","$"]]}},
  proveedores:{nombre:"Proveedores",sub:"Quién te surte",tabla:"proveedores",boton:"Agregar proveedor",
    aviso:"Solo se puede eliminar si no tiene compras registradas.",
    cols:[["empresa","Empresa"],["contacto","Contacto"],["telefono","Teléfono"]],
    campos:[{k:"empresa",l:"Empresa",req:1},{k:"contacto",l:"Contacto"},{k:"telefono",l:"Teléfono"}],
    orden:[["Empresa (A-Z)","empresa","t"],["Empresa (Z-A)","empresa","t",-1],["Más recientes","creado","d",-1]]},
  caja:{nombre:"Caja",sub:"Ingresos y egresos. Los de ventas y abonos son automáticos y se cambian desde su módulo",tabla:"caja_movimientos",boton:"Registrar movimiento",
    puede:r=>!r.venta_id&&!r.abono_id,
    cols:[["fecha","Fecha y hora","f"],["concepto","Concepto"],["tipo","Tipo"],["monto","Monto","$"]],
    campos:[{k:"concepto",l:"Concepto",req:1},{k:"tipo",l:"Tipo",t:"select",op:["Ingreso","Egreso"]},{k:"monto",l:"Monto",t:"number",req:1}],
    filtros:[{k:"tipo",l:"Tipo"},{k:"fecha",l:"Mes",mes:1}],
    orden:[["Más recientes","fecha","d",-1],["Más antiguos","fecha","d"],["Mayor monto","monto","n",-1]]}
};

const celda = (v, t, r) => t === "$" ? money(v) : t === "f" ? fecha(v) : t === "d" ? soloFecha(v)
  : t === "cli" ? `<button class="enlace" title="Ver el detalle de sus deudas" onclick="verCliente(${r.id})">${esc(v)}</button>`
  : t === "prod" ? `<button class="enlace" title="Ver el detalle del producto" onclick="verProducto(${r.id})">${esc(v)}</button>`
  : t === "venta" ? `<button class="enlace" title="Ver el detalle de la venta" onclick="verVenta(${r.id})">${esc(v)}</button>`
  : t === "mov" ? `<button class="enlace" title="Ver el detalle de este movimiento" onclick="verMovimiento(${r.id})">${esc(v)}</button>`
  : t === "gan" || t === "ganinv" ? (() => { const g = t === "gan" ? r.ganancia : r.ganancia_inv, p = t === "gan" ? r.ganancia_pct : r.ganancia_inv_pct;
      return g == null ? "—" : `${money(g)} (${p == null ? "—" : pct(p)})`; })() : esc(v);
const stat = (n, t, nota) => `<div class="stat"><b>${n}</b><span>${t}</span>${nota ? `<small>${nota}</small>` : ""}</div>`;
const encabezado = (t, s) => `<h2>${t}</h2><p class="sub">${s}</p>`;

const tablaScroll = (cols, filas, acc) => `<div class="tabla-scroll">${tablaHTML(cols, filas, acc)}</div>`;
function tablaHTML(cols, filas, acc) {
  if (!filas.length) return `<p class="vacio">No hay registros.</p>`;
  return `<table><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}${acc ? `<th class="acc">Acciones</th>` : ""}</tr>${
    filas.map(f => `<tr>${cols.map(c => `<td>${celda(f[c[0]], c[2], f)}</td>`).join("")}${acc ? `<td class="acc">${acc(f)}</td>` : ""}</tr>`).join("")}</table>`;
}

/* ---------- Costo de compra = el del ÚLTIMO LOTE (la compra más reciente del inventario) ----------
   Se calcula aquí con los datos que ya existen; no se cambia nada en la base de datos. */
function indexarCompras(movs) {
  const por = {};
  movs.filter(m => m.tipo === "Compra" && Number(m.cantidad) > 0)
    .sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : b.id - a.id)   // la más nueva primero
    .forEach(m => (por[m.producto_id] ||= []).push(m));
  return por;
}
const costoUlt = (por, pid) => por[pid] ? Number(por[pid][0].costo_unitario) : null;
/* Productos: costo del último lote y ganancia por unidad = precio de venta actual − ese costo */
function conUltimoLote(prods, movs) {
  const por = indexarCompras(movs);
  return prods.map(p => {
    const costo = costoUlt(por, p.id) ?? Number(p.precio_compra), g = Number(p.precio_venta) - costo;
    return {...p, costo_ult: costo, ganancia: g, ganancia_pct: costo > 0 ? Math.round(g / costo * 1000) / 10 : null};
  });
}
/* Líneas de venta: usan el precio y el costo GUARDADOS al vender (costo del lote elegido). No se recalculan nunca. */
function itemsConGanancia(items) {
  return items.map(i => {
    const costo = Number(i.costo_unitario), u = Number(i.precio_unitario) - costo;
    return {...i, costo_lote: costo, ganancia: Number(i.cantidad) * u, ganancia_inv: Number(i.cantidad) * u, ganancia_inv_pct: costo > 0 ? Math.round(u / costo * 1000) / 10 : null};
  });
}
/* Ventas: ganancia total = total vendido − total del costo (con el último lote) */
function ventasConGanancia(ventas, items) {
  const g = {};
  items.forEach(i => { const a = g[i.venta_id] ||= {g: 0, c: 0}; a.g += i.ganancia; a.c += Number(i.cantidad) * i.costo_lote; });
  return ventas.map(v => { const a = g[v.id]; return {...v, ganancia: a ? a.g : null, ganancia_pct: a && a.c > 0 ? Math.round(a.g / a.c * 1000) / 10 : null}; });
}

/* ---------- Gráficos (SVG, sin librerías) ---------- */
function grafico(datos, series) {
  const W = 640, H = 230, base = H - 26, alto = H - 56;
  const max = Math.max(1, ...datos.flatMap(d => series.map(s => Number(d[s[0]]) || 0)));
  const bw = W / datos.length, w = Math.min(28, bw * 0.8 / series.length);
  const barras = datos.map((d, i) => {
    const cx = i * bw + bw / 2, x0 = cx - w * series.length / 2;
    return series.map((s, j) => { const h = (Number(d[s[0]]) || 0) / max * alto;
      return `<rect x="${x0 + j * w}" y="${base - h}" width="${w - 1}" height="${h}" rx="2" style="fill:${s[2]}"><title>${esc(d.e)} · ${s[1]}: ${money(d[s[0]])}</title></rect>`; }).join("") +
      `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="${datos.length > 12 ? 9 : 12}" fill="currentColor">${esc(d.e)}</text>`;
  }).join("");

let DIAS = 5;
function cambiarDias(v) { DIAS = Math.max(0, Math.floor(Number(v)) || 0); mostrar(); }
async function vistaVencimientos() {
  const lotes = await api("lotes");
  const orden = (a, b) => a.dias_restantes - b.dias_restantes;
  const vencidos = lotes.filter(x => x.dias_restantes < 0).sort(orden)
    .map(x => ({...x, plazo: `Hace ${-x.dias_restantes} ${x.dias_restantes === -1 ? "día" : "días"}`}));
  const porVencer = lotes.filter(x => x.dias_restantes >= 0 && x.dias_restantes <= DIAS).sort(orden)
    .map(x => ({...x, plazo: x.dias_restantes === 0 ? "Vence hoy" : `En ${x.dias_restantes} ${x.dias_restantes === 1 ? "día" : "días"}`}));
  const uni = arr => arr.reduce((a, x) => a + Number(x.restante), 0);

  const atajos = [3,5,7,15,30].map(n => `<button type="button" onclick="cambiarDias(${n})">${n} días</button>`).join("");

    `<div class="box"><form class="fila" onsubmit="return false">
      <label>Avisar con cuántos días de anticipación<input type="number" min="0" max="365" value="${DIAS}" onchange="cambiarDias(this.value)"></label>${atajos}</form>
      <div class="stats">${stat(uni(vencidos),"Unidades ya vencidas")}${stat(uni(porVencer),`Unidades que vencen en ${DIAS} días o menos`)}</div></div>
    <div class="box" style="margin-top:16px"><b>Por vencer en los próximos ${DIAS} días</b>${
      porVencer.length ? tablaScroll(cols("Vence"), porVencer) : `<p class="vacio">No hay productos por vencer en ese plazo.</p>`}</div>
    <div class="box" style="margin-top:16px"><b>Ya vencidos (con unidades en stock)</b>${
      vencidos.length ? tablaScroll(cols("Venció"), vencidos) : `<p class="vacio">No hay productos vencidos.</p>`}</div>`;
}

const opciones = c => c.src ? VIS.listas[c.src].map(o => [o.id, o[c.ver]]) : c.op.map(o => [o, o]);
/* ---------- Autocompletar: el usuario escribe y se sugieren los registros que existen ---------- */
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const extraAuto = (src, o) => src === "productos" ? `${money(o.precio_venta)} · stock ${o.stock}` : src === "clientes" ? (Number(o.deuda) > 0 ? `debe ${money(o.deuda)}` : (o.telefono || "")) : src === "proveedores" ? (o.contacto || "") : "";
const itemsAuto = inp => VIS.listas[inp.dataset.src].map(o => ({id: o.id, t: o[inp.dataset.ver], x: extraAuto(inp.dataset.src, o),
  off: !!inp.dataset.sinstock && Number(o.stock) <= 0}));
const autoHid = inp => inp.parentNode.querySelector('input[type=hidden]');
const autoLista = inp => inp.parentNode.querySelector(".auto-lista");
function autoHTML(c, v, bloq, o = {}) {
  const act = v ? VIS.listas[c.src].find(x => String(x.id) === String(v)) : null;
  return `<div class="campo">${c.l}<div class="auto">
    <input class="auto-in" type="text" autocomplete="off" placeholder="Escribe para buscar…" value="${esc(act ? act[c.ver] : "")}"
      data-src="${c.src}" data-ver="${c.ver}" ${o.sinstock ? 'data-sinstock="1"' : ""} ${o.onpick ? `data-onpick="${o.onpick}"` : ""} ${c.req ? "required" : ""} ${bloq ? "disabled" : ""}
      oninput="autoEscribir(this)" onfocus="autoBuscar(this)" onkeydown="autoTecla(event,this)" onblur="autoCerrar(this)">
    <input type="hidden" ${o.cls ? `class="${o.cls}"` : ""} name="${c.k}" value="${esc(v ?? "")}" ${bloq ? "disabled" : ""}>
    <div class="auto-lista" hidden></div></div></div>`;
}
const autoAvisar = inp => { const f = inp.dataset.onpick; if (f && window[f]) window[f](autoHid(inp)); };
function autoEscribir(inp) {
  const hid = autoHid(inp);
  inp.setCustomValidity("");
  if (hid.value) { hid.value = ""; autoAvisar(inp); }   // el texto cambió: ya no hay nada elegido
  autoBuscar(inp);
}
function autoBuscar(inp) {
  const lista = autoLista(inp), q = norm(inp.value.trim());
  const r = itemsAuto(inp).filter(i => !q || norm(i.t).includes(q))
    .sort((a, b) => (norm(a.t).startsWith(q) ? 0 : 1) - (norm(b.t).startsWith(q) ? 0 : 1) || String(a.t).localeCompare(String(b.t), "es")).slice(0, 8);
  inp._r = r; inp._i = r.findIndex(x => !x.off);
  lista.innerHTML = r.length ? r.map((x, i) => `<div class="auto-op ${x.off ? "off" : ""} ${i === inp._i ? "sel" : ""}" ${x.off ? "" : `onmousedown="autoElegir(event,this,${x.id})"`}><span>${esc(x.t)}</span><small>${esc(x.off ? "sin stock" : x.x)}</small></div>`).join("")
    : `<div class="auto-nada">No hay coincidencias</div>`;
  lista.hidden = false;
}
function autoElegir(ev, el, id) {
  ev.preventDefault();
  const inp = el.closest(".auto").querySelector(".auto-in"), it = inp._r.find(x => x.id === id);
  inp.value = it.t; autoHid(inp).value = id; inp.setCustomValidity(""); autoLista(inp).hidden = true; autoAvisar(inp);
}
function autoResolver(inp) {   // si escribió el nombre completo sin elegirlo de la lista, lo reconoce; si no, avisa
  const hid = autoHid(inp), t = norm(inp.value.trim());
  if (!hid.value && t) {
    const it = itemsAuto(inp).find(x => norm(x.t) === t && !x.off);
    if (it) { hid.value = it.id; inp.value = it.t; autoAvisar(inp); }
  }
  inp.setCustomValidity(!hid.value && t ? "Elige una opción de la lista" : "");
}
function autoCerrar(inp) { autoLista(inp).hidden = true; autoResolver(inp); }
function autoTecla(ev, inp) {
  const lista = autoLista(inp), r = inp._r || [];
  if (ev.key === "Escape") { lista.hidden = true; return; }
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    if (lista.hidden) autoBuscar(inp);
    const rr = inp._r || [], n = rr.length;
    if (!n || rr.every(x => x.off)) return;
    let i = inp._i ?? -1;
    do { i = (i + (ev.key === "ArrowDown" ? 1 : n - 1)) % n; } while (rr[i].off);
    inp._i = i;
    [...lista.children].forEach((c, k) => c.classList.toggle("sel", k === i));
    if (lista.children[i] && lista.children[i].scrollIntoView) lista.children[i].scrollIntoView({block: "nearest"});
  }
  if (ev.key === "Enter") {
    if (!lista.hidden && r[inp._i] && !r[inp._i].off) { ev.preventDefault(); autoElegir({preventDefault() {}}, lista.children[inp._i], r[inp._i].id); }
    else autoResolver(inp);
  }
}

function campoHTML(c, v, bloq) {

    : `<input name="${c.k}" type="${c.t || "text"}" value="${esc(val)}" ${c.t === "number" ? 'step="any"' : ""} ${c.req ? "required" : ""} ${bloq ? "disabled" : ""}>`;

function formVentaHTML() {

  return `<p class="sec">Registrar venta</p><form class="fila" oninput="calc()" onsubmit="guardarVenta(event)">

const lineaHTML = () => `<div class="linea">${autoHTML({k:"producto_id",l:"Producto",src:"productos",ver:"nombre",req:1}, null, false, {sinstock:1, onpick:"cambiarProducto", cls:"pid"})}
  <label>N° de lote (solo con unidades)<select class="lote" disabled><option value="">Primero elige el producto</option></select></label>
  <label>Cantidad<input class="cant" type="number" min="1" step="1" value="1"></label>
  <label>Precio de venta al público (por unidad)<input class="precio" type="number" min="0" step="any" placeholder="Escríbelo según el último lote"></label>
  <span class="subt">Subtotal: ${money(0)}</span>
  <button type="button" class="gris" onclick="this.parentNode.remove();calc()">Quitar</button></div>`;
const addLinea = () => document.getElementById("lineas").insertAdjacentHTML("beforeend", lineaHTML());
/* El lote depende del producto: solo salen los lotes de ese producto que todavía tienen unidades (primero el que vence antes).
   El precio se sugiere con el último que se usó para ese producto, pero el usuario lo escribe/cambia. */
function cambiarProducto(sel) {
  const linea = sel.closest(".linea"), lote = linea.querySelector(".lote"), precio = linea.querySelector(".precio");
  const ls = LOTES.filter(x => String(x.producto_id) === sel.value && x.restante > 0)
    .sort((a, b) => (a.fecha_vencimiento || "9999") < (b.fecha_vencimiento || "9999") ? -1 : 1);
  lote.disabled = !ls.length;
  lote.innerHTML = ls.length
    ? ls.map(x => `<option value="${x.id}">${esc(x.lote)} · ${x.fecha_vencimiento ? "vence " + soloFecha(x.fecha_vencimiento) : "sin vencimiento"} · quedan ${x.restante}</option>`).join("")
    : `<option value="">${sel.value ? "Sin lotes con unidades" : "Primero elige el producto"}</option>`;
  const p = PRODS.find(x => String(x.id) === sel.value);
  precio.value = p && Number(p.precio_venta) > 0 ? Number(p.precio_venta) : "";
  precio.required = !!sel.value;
  calc();
}
function calc() {
  let t = 0, g = 0;
  document.querySelectorAll(".linea").forEach(l => {
    const p = PRODS.find(x => String(x.id) === l.querySelector(".pid").value);
    const mid = l.querySelector(".lote").value, lote = LOTES.find(x => String(x.id) === mid);
    l.querySelector(".cant").max = lote ? lote.restante : "";            // no se puede vender más de lo que tiene el lote
    const cant = Number(l.querySelector(".cant").value) || 0, precio = Number(l.querySelector(".precio").value) || 0;
    let txt = "Subtotal: " + money(p ? cant * precio : 0);
    if (p) {
      t += cant * precio;
      const costo = COSTOMOV[mid] ?? Number(p.precio_compra);             // costo del lote elegido
      if (precio > 0) {
        g += cant * (precio - costo);
        txt += ` · Costo del lote: ${money(costo)} · Ganancia: ${money(cant * (precio - costo))}${costo > 0 ? ` (${pct((precio - costo) / costo * 100)})` : ""}${precio < costo ? " ⚠ por debajo del costo" : ""}`;
      }
    }
    l.querySelector(".subt").textContent = txt;
  });
  const debe = Number(document.querySelector('[name="debe"]').value) || 0;
  document.getElementById("total").textContent = `Total: ${money(t)} · Ganancia: ${money(g)} · Paga ahora: ${money(Math.max(0, t - debe))} · Debe: ${money(debe)}`;
}
function hint(f) {
  const t = Number(f[HINT.total].value), u = Number(f[HINT.unidades].value), el = document.getElementById("hint");
  if (!(u > 0 && t >= 0)) { el.textContent = ""; return; }
  const pu = t / u; let s = `${HINT.texto || "Precio unitario de compra"}: ${money(pu)}`;
  if (HINT.venta) { const pv = Number(f[HINT.venta].value); if (pv > 0) s += ` · Ganancia: ${money(pv - pu)}${pu > 0 ? ` (${pct((pv - pu) / pu * 100)})` : ""}`; }
  el.textContent = s;
}

/* Filtros, búsqueda y orden */
function opcionesFiltro(f) {
  if (f.fn) return f.fn.map((x, i) => [i, x[0]]);
  const vals = VIS.filas.map(r => r[f.k]).filter(v => v != null && v !== "");
  if (f.mes) return [...new Set(vals.map(mesCO))].sort().reverse().map(m => [m, nombreMes(m)]);
  return [...new Set(vals)].sort((a, b) => String(a).localeCompare(String(b), "es")).map(v => [v, v]);
}
function barraHTML() {
  const {id, m} = VIS, e = E(id);
  const rango = m.rango ? `<label>Desde<input type="date" value="${esc(e.desde || "")}" onchange="setRango('desde',this.value)"></label>
    <label>Hasta<input type="date" value="${esc(e.hasta || "")}" onchange="setRango('hasta',this.value)"></label>
    <span class="atajos"><button type="button" class="mini gris" onclick="atajoRango('hoy')">Hoy</button><button type="button" class="mini gris" onclick="atajoRango('7')">7 días</button><button type="button" class="mini gris" onclick="atajoRango('mes')">Este mes</button></span>` : "";
  const fil = (m.filtros || []).map((f, i) => `<label>${f.l}<select onchange="setFiltro(${i},this.value)"><option value="">Todos</option>${
    opcionesFiltro(f).map(o => `<option value="${esc(o[0])}" ${String(e.f[i] ?? "") === String(o[0]) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select></label>`).join("");
  return `<div class="bar"><label>Buscar<input value="${esc(e.q)}" oninput="setQ(this.value)" placeholder="Escribe para buscar…"></label>${fil}${rango}
    <label>Ordenar por<select onchange="setOrden(this.value)">${m.orden.map((o, i) => `<option value="${i}" ${e.o === i ? "selected" : ""}>${o[0]}</option>`).join("")}</select></label>
    <button type="button" class="gris" onclick="limpiar()">Limpiar</button></div>`;
}
function visibles() {
  const {id, m, filas} = VIS, e = E(id), q = e.q.trim().toLowerCase();
  const r = filas.filter(x => (!q || m.cols.some(c => String(x[c[0]] ?? "").toLowerCase().includes(q))) &&
    (m.filtros || []).every((f, i) => {
      const v = e.f[i]; if (v === undefined || v === "") return true;
      return f.fn ? f.fn[Number(v)][1](x) : f.mes ? mesCO(x[f.k]) === v : String(x[f.k]) === v;
    }));
  const [d1, d2] = rangoDe(e);
  const r2 = m.rango && (d1 || d2) ? r.filter(x => { const d = diaCO(x.fecha); return (!d1 || d >= d1) && (!d2 || d <= d2); }) : r;
  const [, k, t, dir = 1] = m.orden[e.o];
  return r2.sort((a, b) => {
    const va = a[k], vb = b[k], na = va == null || va === "", nb = vb == null || vb === "";
    if (na || nb) return na === nb ? 0 : na ? 1 : -1;
    const d = t === "n" ? Number(va) - Number(vb) : t === "d" ? (va < vb ? -1 : va > vb ? 1 : 0) : String(va).localeCompare(String(vb), "es", {sensitivity: "base"});
    return d * dir;
  });
}
function listaHTML() {
  const {m, filas} = VIS, r = visibles();
  const acc = x => (m.puede && !m.puede(x)) ? `<span class="subt">Automático</span>` :
    `${m.ver ? `<button class="mini gris" onclick="${m.ver}(${x.id})">Ver</button> ` : ""}<button class="mini" onclick="editar(${x.id})">Editar</button> <button class="mini peligro" onclick="eliminar(${x.id})">Eliminar</button>`;
  return `<p class="subt">Mostrando ${r.length} de ${filas.length} registros</p>${tablaScroll(m.cols, r, acc)}${m.rango ? pieVentas(r) : ""}`;
}
function lista2HTML() {
  const {m, l2} = VIS; if (!m.lista2 || m.lista2.oculta) return "";
  const acc = m.lista2.borrar ? x => `<button class="mini peligro" onclick="eliminarDe('${m.lista2.tabla}',${x.id})">Eliminar</button>` : null;
  return `<div class="box" style="margin-top:16px"><b>${m.lista2.titulo}</b>${tablaScroll(m.lista2.cols, l2, acc)}</div>`;
}
const pintarLista = () => { document.getElementById("lista").innerHTML = listaHTML(); };
const setQ = v => { E(VIS.id).q = v; pintarLista(); };
const setFiltro = (i, v) => { E(VIS.id).f[i] = v; pintarLista(); };
const setOrden = v => { E(VIS.id).o = Number(v); pintarLista(); };
function limpiar() { EST[VIS.id] = {q: "", f: {}, o: 0}; document.getElementById("barra").innerHTML = barraHTML(); pintarLista(); }

/* ---------- Ventas: rango de fechas, total al pie y resumen del periodo ---------- */
const rangoDe = e => { const a = e.desde || "", b = e.hasta || ""; return a && b && a > b ? [b, a] : [a, b]; };   // si se escriben al revés, se corrigen
const hayFiltro = e => !!(e.q.trim() || e.desde || e.hasta || Object.values(e.f).some(v => v !== undefined && v !== ""));
const suma = (a, fn) => a.reduce((t, x) => t + (Number(fn(x)) || 0), 0);
function setRango(k, v) { E(VIS.id)[k] = v; pintarLista(); }
function atajoRango(t) {
  const e = E(VIS.id), hoy = diaCO(new Date());
  if (t === "hoy") { e.desde = hoy; e.hasta = hoy; }
  else if (t === "7") { e.desde = diaCO(new Date(Date.now() - 6 * 864e5)); e.hasta = hoy; }
  else { e.desde = hoy.slice(0, 8) + "01"; e.hasta = hoy; }
  document.getElementById("barra").innerHTML = barraHTML();
  pintarLista();
}
function textoPeriodo(e) {
  const [a, b] = rangoDe(e);
  return !a && !b ? "" : a && b ? (a === b ? soloFecha(a) : `${soloFecha(a)} al ${soloFecha(b)}`) : a ? `desde ${soloFecha(a)}` : `hasta ${soloFecha(b)}`;
}
function pieVentas(r) {
  const e = E(VIS.id), total = suma(r, v => v.total), per = textoPeriodo(e);
  const titulo = !hayFiltro(e) ? "Total de todas las ventas" : per ? `Total vendido · ${per}` : "Total de las ventas filtradas";
  return `<div class="pie-total"><span>${titulo} <small>(${r.length} ${r.length === 1 ? "venta" : "ventas"})</small></span>
    <span><button type="button" class="enlace" title="Ver el resumen detallado" onclick="resumenVentas()">${money(total)}</button> <small>← clic para ver el resumen</small></span></div>`;
}
const barras = (filas, fmt = money) => { const mx = Math.max(...filas.map(f => f[1]), 1);
  return filas.map(f => `<div class="hb" style="grid-template-columns:minmax(90px,150px) 1fr 110px"><span>${esc(f[0])}</span><div class="hbar"><i style="width:${Math.max(2, Math.round(f[1] / mx * 100))}%"></i></div><span style="text-align:right">${fmt(f[1])}</span></div>`).join(""); };
function resumenVentas() {
  const r = visibles(), e = E(VIS.id), per = textoPeriodo(e);
  const sub = (per ? per + " · " : hayFiltro(e) ? "Ventas filtradas · " : "Todas las ventas · ") + `${r.length} ${r.length === 1 ? "venta" : "ventas"}`;
  if (!r.length) return abrirModal(cabModal("Resumen de ventas", sub) + `<p class="vacio">No hay ventas con este filtro.</p>` + pieModal);

  const ids = new Set(r.map(v => v.id)), items = VIS.l2.filter(i => ids.has(i.venta_id));
  const conDetalle = new Set(items.map(i => i.venta_id)), sinDetalle = r.filter(v => !conDetalle.has(v.id)).length;
  const total = suma(r, v => v.total), fiado = suma(r, v => v.debe), cobrado = total - fiado;
  const unidades = suma(items, i => i.cantidad), costo = suma(items, i => Number(i.cantidad) * i.costo_lote);
  const ganancia = suma(items, i => i.ganancia), vendidoDetalle = suma(items, i => i.subtotal);

  // Por día, por producto y por cliente
  const dias = new Map(), prods = new Map(), clis = new Map();
  r.forEach(v => {
    const k = diaCO(v.fecha), d = dias.get(k) || {n: 0, t: 0}; d.n++; d.t += Number(v.total); dias.set(k, d);
    const c = v.cliente || "Sin cliente (mostrador)", a = clis.get(c) || {cliente: c, ventas: 0, total: 0, debe: 0};
    a.ventas++; a.total += Number(v.total); a.debe += Number(v.debe); clis.set(c, a);
  });
  items.forEach(i => { const a = prods.get(i.producto_id) || {producto: i.producto, unidades: 0, total: 0, ganancia: 0};
    a.unidades += Number(i.cantidad); a.total += Number(i.subtotal); a.ganancia += i.ganancia; prods.set(i.producto_id, a); });
  const listaProd = [...prods.values()], listaCli = [...clis.values()].sort((a, b) => b.total - a.total);
  const mejorDia = [...dias].sort((a, b) => b[1].t - a[1].t)[0], mayor = [...r].sort((a, b) => Number(b.total) - Number(a.total))[0];
  const estrella = [...listaProd].sort((a, b) => b.unidades - a.unidades)[0];
  const deudaClientes = suma(VIS.listas.clientes || [], c => c.deuda);

  // Gráfico: por día (hasta 31 días) o por mes
  const porMes = dias.size > 31, graf = new Map();
  [...dias].forEach(([k, d]) => { const g = porMes ? k.slice(0, 7) : k; graf.set(g, (graf.get(g) || 0) + d.t); });
  const filasGraf = [...graf].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, t]) => [porMes ? nombreMes(k) : soloFecha(k).slice(0, 5), t]);

  const pc = (a, b) => b > 0 ? pct(a / b * 100) : "—";
  abrirModal(cabModal("Resumen de ventas", sub) +
    (sinDetalle ? `<p class="subt">⚠ ${sinDetalle} ${sinDetalle === 1 ? "venta no tiene" : "ventas no tienen"} el detalle de productos guardado: no se cuentan en ganancia, unidades ni productos.</p>` : "") +
    seccionHTML("Ventas", gridHTML([datoHTML("Total vendido", money(total)), datoHTML("N° de ventas", r.length), datoHTML("Venta promedio", money(total / r.length)),
      datoHTML("Venta más grande", `${money(mayor.total)} <small>(N° ${mayor.id})</small>`)])) +
    seccionHTML("Ganancia", gridHTML([datoHTML("Ganancia total", money(ganancia)), datoHTML("% de ganancia sobre el costo", pc(ganancia, costo)),
      datoHTML("Margen sobre lo vendido", pc(ganancia, vendidoDetalle)), datoHTML("Costo de lo vendido", money(costo))])) +
    seccionHTML("Cobros y deudas", gridHTML([datoHTML("Cobrado en las ventas", money(cobrado)), datoHTML("Quedó fiado en el periodo", money(fiado)),
      datoHTML("% fiado del total", pc(fiado, total)), datoHTML("Ventas con deuda", r.filter(v => Number(v.debe) > 0).length),
      datoHTML("Deuda actual de todos los clientes", money(deudaClientes))])) +
    seccionHTML("Productos", gridHTML([datoHTML("Unidades vendidas", unidades), datoHTML("Productos distintos", prods.size),
      datoHTML("Más vendido", estrella ? `${esc(estrella.producto)} <small>(${estrella.unidades} u.)</small>` : "—")])) +
    seccionHTML("Días", gridHTML([datoHTML("Días con ventas", dias.size), datoHTML("Promedio por día con ventas", money(total / dias.size)),
      datoHTML("Mejor día", `${soloFecha(mejorDia[0])} <small>(${money(mejorDia[1].t)})</small>`)])) +
    (filasGraf.length > 1 ? seccionHTML(porMes ? "Ventas por mes" : "Ventas por día", barras(filasGraf)) : "") +
    `<div class="cols2"><div>${seccionHTML("Productos que más dejaron", listaProd.length ? `<div class="tabla">${tablaHTML([["producto", "Producto"], ["unidades", "Unid."], ["total", "Vendido", "$"], ["ganancia", "Ganancia", "$"]],
      [...listaProd].sort((a, b) => b.ganancia - a.ganancia).slice(0, 5))}</div>` : `<p class="vacio">Sin detalle de productos.</p>`)}</div>
     <div>${seccionHTML("Clientes que más compraron", `<div class="tabla">${tablaHTML([["cliente", "Cliente"], ["ventas", "Ventas"], ["total", "Total", "$"], ["debe", "Debe", "$"]], listaCli.slice(0, 5))}</div>`)}</div></div>` + pieModal);
}

/* ---------- Ventana de detalle del cliente (deudas, productos y abonos) ---------- */
function abrirModal(html) {
  cerrarModal();
  document.body.insertAdjacentHTML("beforeend", `<div id="modal" class="modal-fondo" onmousedown="if(event.target===this)cerrarModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`);
  document.body.style.overflow = "hidden";
}
function cerrarModal() {
  const d = document.getElementById("modal");
  if (d && d.remove) d.remove();
  document.body.style.overflow = "";
}
addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

function detalleClienteHTML(c, ventas, items, abonos) {
  const cron = (a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
  const vs = ventas.filter(v => String(v.cliente_id) === String(c.id) && Number(v.debe) > 0).sort(cron);
  const ab = abonos.filter(a => String(a.cliente_id) === String(c.id)).sort(cron);
  const ids = new Set(vs.map(v => v.id)), porVenta = {};
  items.filter(i => ids.has(i.venta_id)).forEach(i => (porVenta[i.venta_id] ||= []).push(i));
  // Lo que debe de cada producto: si la venta se pagó en parte, la deuda se reparte según el valor de cada producto
  const parte = (i, v) => Number(v.total) > 0 ? Number(i.subtotal) * Number(v.debe) / Number(v.total) : 0;
  const res = {};
  vs.forEach(v => (porVenta[v.id] || []).forEach(i => {
    const r = res[i.producto_id] ||= {producto: i.producto, unidades: 0, debe: 0};
    r.unidades += Number(i.cantidad); r.debe += parte(i, v);
  }));
  const resumen = Object.values(res).sort((a, b) => b.debe - a.debe);
  const fiado = vs.reduce((a, v) => a + Number(v.debe), 0), abonado = ab.reduce((a, x) => a + Number(x.monto), 0);
  const tb = (cols, filas) => `<div class="tabla">${tablaHTML(cols, filas)}</div>`;
  const parcial = vs.some(v => Number(v.debe) < Number(v.total));
  const ventasHTML = vs.map(v => `<div class="venta-det"><p><b>Venta N° ${v.id}</b> · ${fecha(v.fecha)} · Total ${money(v.total)} · Pagó ${money(Number(v.total) - Number(v.debe))} · <b>Debe ${money(v.debe)}</b></p>${
    (porVenta[v.id] || []).length ? tb([["producto","Producto"],["lote","N° de lote"],["cantidad","Cantidad"],["precio_unitario","Precio unitario","$"],["subtotal","Total","$"],["parte","Le corresponde de la deuda","$"]],
      porVenta[v.id].map(i => ({...i, parte: parte(i, v)}))) : `<p class="vacio">Esta venta no tiene el detalle de productos guardado.</p>`}</div>`).join("");
  return `<div class="modal-cab"><div><h3>${esc(c.nombre)}</h3><p class="subt">${esc([c.telefono, c.correo].filter(Boolean).join(" · ") || "Sin datos de contacto")}</p></div>
      <button class="gris" onclick="cerrarModal()">Cerrar ✕</button></div>
    <div class="stats">${stat(money(c.deuda), "Deuda actual")}${stat(money(fiado), "Fiado en ventas")}${stat(money(abonado), "Abonos pagados")}</div>
    ${vs.length ? `<h4>Productos que debe</h4>${tb([["producto","Producto"],["unidades","Unidades en esas ventas"],["debe","Valor que debe","$"]], resumen)}
      <p class="total" style="margin:6px 0">Total fiado: ${money(fiado)}</p>
      ${parcial ? `<p class="subt">En las ventas pagadas en parte, la deuda se reparte en proporción al valor de cada producto. Los abonos se descuentan de la deuda total del cliente, no de una venta en particular.</p>` : ""}
      <h4>Detalle por venta</h4>${ventasHTML}` : `<p class="vacio">Este cliente no tiene ventas fiadas.</p>`}
    <h4>Abonos</h4>${ab.length ? `${tb([["fecha","Fecha y hora","f"],["monto","Monto","$"]], ab)}<p class="total" style="margin:6px 0">Total abonado: ${money(abonado)}</p>` : `<p class="vacio">Todavía no hay abonos.</p>`}
    <div style="margin-top:14px;text-align:right"><button class="gris" onclick="cerrarModal()">Cerrar</button></div>`;
}
async function verCliente(id) {
  const c = VIS.filas.find(x => x.id === id);
  if (!c) return;
  abrirModal(`<p class="subt">Cargando…</p>`);
  try {
    VIS.det ||= await Promise.all([api("ventas"), api("venta_items")]);
    abrirModal(detalleClienteHTML(c, VIS.det[0], VIS.det[1], VIS.l2));
  } catch (e) {
    if (e.message === "AUTH") { cerrarModal(); return mostrar(); }
    abrirModal(`<div class="msg">${error(e)}</div><button class="gris" onclick="cerrarModal()">Cerrar</button>`);
  }
}

/* ---------- Ventanas de detalle: toda la información del producto, la venta o la compra ---------- */
const datoHTML = (l, v) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`;
const gridHTML = items => `<div class="stats chico">${items.join("")}</div>`;
const seccionHTML = (t, h) => `<h4>${t}</h4>${h}`;
const cabModal = (t, sub) => `<div class="modal-cab"><div><h3>${t}</h3><p class="subt">${sub}</p></div><button class="gris" onclick="cerrarModal()">Cerrar ✕</button></div>`;
const pieModal = `<div style="margin-top:14px;text-align:right"><button class="gris" onclick="cerrarModal()">Cerrar</button></div>`;
const porVencimiento = (a, b) => (a.fecha_vencimiento || "9999") < (b.fecha_vencimiento || "9999") ? -1 : 1;

function verProducto(id) {
  const p = VIS.filas.find(x => x.id === id);
  if (!p) return;
  const lotes = (VIS.listas.lotes_stock || []).filter(l => l.producto_id === id).sort(porVencimiento)
    .map(l => ({...l, estado: l.restante > 0 ? "Con unidades" : "Agotado"}));
  const estado = p.stock <= 0 ? "Sin stock" : p.stock <= p.stock_minimo ? "Stock bajo" : "Normal";
  abrirModal(cabModal(esc(p.nombre), `Código ${esc(p.codigo || "—")} · ${esc(p.categoria || "Sin categoría")}`) +
    seccionHTML("Datos del producto", gridHTML([datoHTML("Código", esc(p.codigo || "—")), datoHTML("Producto", esc(p.nombre)), datoHTML("Categoría", esc(p.categoria || "Sin categoría"))])) +
    seccionHTML("Precios y ganancia", gridHTML([datoHTML("Precio de venta al público", money(p.precio_venta)), datoHTML("Costo del último lote", money(p.costo_ult)),
      datoHTML("Ganancia por unidad", celda(null, "gan", p)), datoHTML("Precio total de compra (registro del producto)", money(p.precio_total_compra)),
      datoHTML("Unidades compradas (registro del producto)", esc(p.unidades_compra)), datoHTML("Precio unitario de compra (registro del producto)", money(p.precio_compra))])) +
    seccionHTML("Existencias", gridHTML([datoHTML("Stock actual", esc(p.stock)), datoHTML("Stock mínimo", esc(p.stock_minimo)), datoHTML("Estado", estado),
      datoHTML("Valor del stock a costo", money(p.stock * p.costo_ult)), datoHTML("Valor del stock a precio de venta", money(p.stock * p.precio_venta))])) +
    seccionHTML("Lotes", lotes.length ? `<div class="tabla">${tablaHTML([["lote","N° de lote"],["fecha_vencimiento","Vence","d"],["cantidad_inicial","Unidades compradas"],["restante","Unidades que quedan"],["estado","Estado"]], lotes)}</div>`
      : `<p class="vacio">Este producto no tiene lotes registrados.</p>`) + pieModal);
}

function verVenta(id) {
  const v = VIS.filas.find(x => x.id === id);
  if (!v) return;
  const prods = Object.fromEntries((VIS.listas.productos || []).map(p => [p.id, p]));
  const cli = (VIS.listas.clientes || []).find(c => c.id === v.cliente_id);
  const filas = VIS.l2.filter(i => i.venta_id === id).map(i => ({...i, codigo: (prods[i.producto_id] || {}).codigo, categoria: (prods[i.producto_id] || {}).categoria}));
  const unidades = filas.reduce((a, i) => a + Number(i.cantidad), 0), costo = filas.reduce((a, i) => a + Number(i.cantidad) * i.costo_lote, 0);
  const quien = esc(v.cliente || "Sin cliente (mostrador)");
  abrirModal(cabModal(`Venta N° ${v.id}`, `${fecha(v.fecha)} · ${quien}`) +
    seccionHTML("Resumen de la venta", gridHTML([datoHTML("Fecha y hora", fecha(v.fecha)), datoHTML("Cliente", quien),
      ...(cli ? [datoHTML("Teléfono del cliente", esc(cli.telefono || "—")), datoHTML("Deuda actual del cliente", money(cli.deuda))] : []),
      datoHTML("Unidades vendidas", unidades), datoHTML("Total vendido", money(v.total)), datoHTML("Pagó en la venta", money(Number(v.total) - Number(v.debe))),
      datoHTML("Quedó debiendo", money(v.debe)), datoHTML("Costo total (de los lotes vendidos)", money(costo)), datoHTML("Ganancia", celda(null, "gan", v))])) +
    seccionHTML("Productos vendidos", filas.length ? `<div class="tabla">${tablaHTML([["producto","Producto"],["codigo","Código"],["categoria","Categoría"],["lote","N° de lote"],["cantidad","Cantidad"],
      ["precio_unitario","Precio unitario","$"],["costo_lote","Costo unitario (lote)","$"],["subtotal","Total","$"],["ganancia_inv","Ganancia","ganinv"]], filas)}</div>`
      : `<p class="vacio">Esta venta no tiene el detalle de productos guardado.</p>`) + pieModal);
}

function verMovimiento(id) {
  const r = VIS.filas.find(x => x.id === id);
  if (!r) return;
  const lote = (VIS.listas.lotes_stock || []).find(x => x.id === id);   // solo las compras (y ajustes que suman) son lotes
  const prod = (VIS.listas.productos || []).find(p => p.id === r.producto_id) || {};
  const prov = (VIS.listas.proveedores || []).find(p => p.id === r.proveedor_id);
  let vence = "Sin vencimiento";
  if (r.fecha_vencimiento) {
    const d = Math.round((new Date(r.fecha_vencimiento + "T00:00:00Z") - new Date(diaCO(new Date()) + "T00:00:00Z")) / 86400000);
    vence = `${soloFecha(r.fecha_vencimiento)} (${d < 0 ? `venció hace ${-d} ${d === -1 ? "día" : "días"}` : d === 0 ? "vence hoy" : `faltan ${d} ${d === 1 ? "día" : "días"}`})`;
  }
  abrirModal(cabModal(`${r.tipo === "Compra" ? "Compra" : "Ajuste"} de inventario`, `Movimiento N° ${r.id} · ${fecha(r.fecha)}`) +
    seccionHTML("Producto y proveedor", gridHTML([datoHTML("Fecha de compra", fecha(r.fecha)), datoHTML("Tipo", esc(r.tipo)), datoHTML("Producto", esc(r.producto)),
      datoHTML("Código", esc(prod.codigo || "—")), datoHTML("Categoría", esc(r.categoria || "Sin categoría")), datoHTML("Proveedor", esc(r.proveedor || "Sin proveedor")),
      ...(prov ? [datoHTML("Contacto del proveedor", esc([prov.contacto, prov.telefono].filter(Boolean).join(" · ") || "—"))] : [])])) +
    seccionHTML("Lote y precios", gridHTML([datoHTML("N° de lote", esc(r.lote)), datoHTML("Unidades", esc(r.cantidad)), datoHTML("Precio total", money(r.precio_total)),
      datoHTML("Precio unitario", money(r.costo_unitario)), datoHTML("Fecha de vencimiento", vence)])) +
    seccionHTML("Estado del lote", lote ? gridHTML([datoHTML("Unidades que quedan", esc(lote.restante)), datoHTML("Unidades ya vendidas o descontadas", esc(lote.cantidad_inicial - lote.restante)),
      datoHTML("Estado", lote.restante > 0 ? "Con unidades" : "Agotado")]) : `<p class="vacio">Este movimiento no es un lote (por ejemplo, un ajuste que resta unidades).</p>`) + pieModal);
}

/* Guardar, editar, eliminar */
async function enviar(fn) {
  try { await fn(); mostrar(); }
  catch (e) {
    if (e.message === "AUTH") return mostrar();
    document.getElementById("aviso").innerHTML = `<div class="msg">${error(e)}</div>`;
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}
const datosForm = f => { const d = {}; new FormData(f).forEach((v, k) => { d[k] = v === "" ? null : v; }); return d; };
const guardar = ev => { ev.preventDefault(); const {m, edit} = VIS; return enviar(() => api(m.tabla, edit ? "PUT" : "POST", datosForm(ev.target), edit && edit.id)); };
const guardarExtra = ev => { ev.preventDefault(); return enviar(() => api(VIS.m.extra.tabla, "POST", datosForm(ev.target))); };
function guardarVenta(ev) {
  ev.preventDefault();
  const f = ev.target;
  const items = [...f.querySelectorAll(".linea")]
    .map(l => ({producto_id: l.querySelector(".pid").value, movimiento_id: l.querySelector(".lote").value || null, cantidad: l.querySelector(".cant").value, precio: l.querySelector(".precio").value}))
    .filter(i => i.producto_id);
  return enviar(() => api("ventas", "POST", {cliente_id: f.cliente_id.value || null, debe: f.debe.value || 0, items}));
}
function editar(rid) { VIS.edit = VIS.filas.find(r => r.id === rid); pintarForm(); window.scrollTo({top: 0, behavior: "smooth"}); }
function cancelar() { VIS.edit = null; pintarForm(); }
const eliminar = rid => confirm(`¿Eliminar este registro?\n${VIS.m.aviso || "Esta acción no se puede deshacer."}`) ? enviar(() => api(VIS.m.tabla, "DELETE", null, rid)) : null;
const eliminarDe = (tabla, rid) => confirm("¿Eliminar este registro?\nSi tenía un ingreso en caja, también se quita.") ? enviar(() => api(tabla, "DELETE", null, rid)) : null;

/* ---------- Acceso y navegación ---------- */
function login(aviso = "") {
  document.getElementById("app").innerHTML = encabezado("Iniciar sesión","Escribe la clave de administrador") +
    `<div class="box login">${aviso}<form class="fila" onsubmit="entrar(event)">
      <label>Clave<input type="password" name="k" required autofocus></label><button>Entrar</button></form></div>`;
}
async function entrar(ev) {
  ev.preventDefault();
  sessionStorage.setItem("k", new FormData(ev.target).get("k"));
  try { await api("categorias"); mostrar(); }
  catch (e) { login(`<div class="msg">${e.message === "AUTH" ? "La clave no es correcta." : error(e)}</div>`); }
}

async function mostrar() {
  const h = location.hash.slice(1);
  if (h === "salir") { sessionStorage.removeItem("k"); location.hash = "dashboard"; return; }
  const id = (h in CFG || h in VISTAS) ? h : "dashboard";
  const orden = ["dashboard","categorias","productos","inventario","vencimientos","ventas","clientes","proveedores","reportes","caja"];
  const nombre = k => ({dashboard:"Dashboard", reportes:"Reportes", vencimientos:"Por vencer"})[k] || CFG[k].nombre;
  document.getElementById("menu").innerHTML = orden.map(k => `<a href="#${k}" class="${k === id ? "active" : ""}">${nombre(k)}</a>`).join("") + `<a href="#salir">Salir</a>`;
  document.title = nombre(id) + " · Mi Tienda";
  if (!sessionStorage.getItem("k")) return login();
  const app = document.getElementById("app");
  app.innerHTML = `<p class="sub">Cargando…</p>`;
  try { app.innerHTML = id in VISTAS ? await VISTAS[id]() : await vistaLista(id); }
  catch (e) { if (e.message === "AUTH") return login(`<div class="msg">La clave no es correcta.</div>`); app.innerHTML = `<div class="msg">${error(e)}</div>`; }
}
addEventListener("hashchange", mostrar);
mostrar();
</script>
